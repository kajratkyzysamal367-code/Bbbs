.phn{width:390px;max-width:100%;height:100%;max-height:800px;border-radius:38px;border:8px solid #222;overflow:hidden;background:#fff}.pcw{width:100%;height:100%;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #0003}.pst iframe{width:100%;height:100%;border:0}
.md{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.md.on{display:flex}.mb{background:var(--c);border-radius:24px;padding:24px;width:100%;max-width:380px}.mb input{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;margin:12px 0;font-size:16px;background:var(--c)}.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--b);padding:12px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:40;pointer-events:none;font-size:14px}.ts.on{opacity:1;transform:translate(-50%,0)}
.gd{max-width:720px;margin:auto;padding:24px 16px 60px}.gd .box{margin-top:14px}.gd ol{padding-left:20px;font-size:14px}.gd li{margin:6px 0}.gd code{background:var(--sf);padding:1px 6px;border-radius:6px;word-break:break-all}

async function cp(id){const o=P.find(p=>p.id==id),n=await ask('Название копии',o.name+' (копия)');if(n==null)return;const c=snap(o);c.id=nid();c.name=n||c.name;c.upd=Date.now();P.unshift(c);put(c);draw();toast('Копия создана')}
async function dl(id){if(!await ask('Удалить проект?','Фото и тексты проекта будут удалены без возможности восстановления.','Удалить',false))return;P=P.filter(p=>p.id!=id);tx('readwrite',s=>s.delete(id));draw()}
async function bk(){const b=new Blob([JSON.stringify(P)],{type:'application/json'});try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'toi-design-backup.json',data:b});return}}catch(e){return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='toi-design-backup.json';a.click()}
async function rs(i){try{const a=JSON.parse(await i.files[0].text());for(const p of a){await put(p);P=P.filter(x=>x.id!=p.id);P.push(p)}toast('Загружено проектов: '+a.length);draw()}catch(e){toast('Файл копии не читается')}}

/* ===== РЕДАКТОР ===== */
const TABS=[['tpl','Шаблон','layout'],['txt','Текст','type'],['ph','Фото','image'],['ds','Дизайн','palette'],['fin','Готово','share']];
const FD=[['n1','Имя 1 (например, жених)','text'],['n2','Имя 2 (например, невеста)','text'],['ev','Название мероприятия','text'],['date','Дата','date'],['time','Время','time'],['venue','Название ресторана','text'],['addr','Адрес','text'],['map','Ссылка Google Maps (по желанию, иначе по адресу)','url'],['txt','Текст приглашения','t'],['par','Имена родителей','t'],['prog','Программа (каждая строка — пункт)','t'],['info','Для гостей: дресс-код и т.д.','t'],['phone','WhatsApp для ответов гостей, например 77011234567','tel'],['age','Возраст именинника (число, по желанию)','text']];
const fld=(l,h)=>`<div class="f"><span>${l}</span>${h}</div>`;
const sel=(k,o,v)=>`<select data-s="${k}">${o.map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${b}</option>`).join('')}</select>`;
const chk=(k,l)=>`<label class="chk"><input type="checkbox" data-s="${k}" ${cur.s[k]!==false&&cur.s[k]?'checked':''}> ${l}</label>`;
const PN={tpl:()=>`<div class="grid g2">${TPL.map(t=>card(t,t.id==cur.tpl)).join('')}</div><p class="hint">При смене шаблона цвета и шрифты станут как в новом дизайне. Тексты и фото сохраняются. Отменить можно кнопкой ↶.</p>`,
txt:()=>fld('Тип мероприятия','<select data-ev>'+Object.entries(EV).map(([k,v])=>`<option value="${k}" ${k==(cur.evt||'wedding')?'selected':''}>${v.n}</option>`).join('')+'</select>')+fld('Язык приглашения',`<div class="seg">${[['ru','Русский'],['kk','Қазақша']].map(([k,t])=>`<button class="${cur.lang==k?'on':''}" data-p="lang" data-v="${k}">${t}</button>`).join('')}</div>`)+`<button class="btn s" style="margin-bottom:14px" data-a="dtxt">Вставить готовый текст и программу для этого мероприятия</button>`+FD.filter(x=>(x[0]!='n2'||(EV[cur.evt]||EV.wedding).two)&&(x[0]!='age'||cur.evt=='bday')).map(([k,l,t])=>fld(k=='n1'?(EV[cur.evt]||EV.wedding).l1:k=='n2'?(EV[cur.evt]||EV.wedding).l2:l,t=='t'?`<textarea data-d="${k}">${esc(cur.d[k])}</textarea>`:`<input type="${t}" data-d="${k}" value="${esc(cur.d[k])}">`)).join(''),
ph:()=>`<label class="btn g" style="width:100%">${ic('image')} Загрузить фото<input type="file" accept="image/*" multiple hidden id="fu"></label><input type="file" accept="image/*" hidden id="fr"><p class="hint" style="margin-top:8px">Можно выбрать сразу несколько фото из галереи. ★ — главное фото обложки. Первое фото в гелерее — обложка, остальные идут в галерею, последнее — на финальный экран.</p><div class="pgr">${cur.photos.map((s,i)=>`<div class="pc"><img src="${s}" alt="">${i==cur.cover?'<b class="bd">Обложка</b>':''}<div class="ac"><button data-a="c:${i}" aria-label="Обложка">${ic('star')}</button><button data-a="l:${i}" aria-label="Влево">${ic('back')}</button><button data-a="r:${i}" aria-label="Вправо" style="transform:scaleX(-1)">${ic('back')}</button><button data-a="p:${i}" aria-label="Заменить">${ic('image')}</button><button data-a="x:${i}" aria-label="Удалить">${ic('x')}</button></div></div>`).join('')}</div>${fld('Расположение фото в галерее',sel('lay',[['grid','Сетка'],['car','Лента (свайп)'],['col','Коллаж']],cur.s.lay))}<h3 style="margin:22px 0 8px;font-size:22px">Музыка</h3><label class="btn" style="width:100%">${ic('music')} ${cur.music?'Заменить музыку':'Загрузить музыку (mp3)'}<input type="file" accept="audio/*" hidden id="fm"></label>${cur.music?`<p class="hint" style="margin:8px 0">${esc(cur.mname)}</p><audio controls src="${cur.music}" style="width:100%"></audio><button class="btn s" style="margin-top:8px" data-a="dm">Убрать музыку</button>`:''}<p class="hint" style="margin-top:8px">Гость включает музыку кнопкой ♪ (или она стартует при открытии конверта). Файл лучше до 5 МБ. Слышна в «Предпросмотре».</p>`,
ds:()=>{const s=cur.s;return fld('Готовые палитры',`<div class="pal">${PAL.map((p,i)=>`<button class="sw" aria-label="${p[0]}" title="${p[0]}" data-a="a:${i}" style="background:linear-gradient(135deg,${p[1]} 50%,${p[3]} 50%)"></button>`).join('')}</div>`)+`<div class="row3">${[['bg','Фон'],['fg','Текст'],['ac','Декор']].map(([k,l])=>fld(l,`<input type="color" data-s="${k}" value="${s[k]}">`)).join('')}</div>`+fld('Шрифт заголовков',sel('hf',FN.map(x=>[x,x]),s.hf))+fld('Шрифт текста',sel('bf',FN.map(x=>[x,x]),s.bf))+fld('Размер текста',`<input type="range" data-s="sz" min=".85" max="1.3" step=".05" value="${s.sz}">`)+fld('Отступы между блоками',`<input type="range" data-s="pad" min="24" max="96" value="${s.pad}">`)+fld('Скругление блоков',`<input type="range" data-s="rad" min="0" max="36" value="${s.rad}">`)+fld('Анимация появления',sel('anim',[['none','Без анимации'],['fade','Плавное появление'],['rise','Подъём снизу'],['zoom','Приближение']],s.anim))+fld('Стиль кнопок',sel('btn',[['round','Круглые'],['sq','Квадратные'],['ol','Контурные']],s.btn))+chk('env','Открывающийся конверт')+chk('deco','Цветы, орнаменты и украшения шаблона')+chk('cd','Таймер обратного отсчёта')+chk('rsvp','Форма подтверждения присутствия')},
fin:()=>`<div class="box"><h3>Готово к отправке</h3><p style="margin-bottom:12px">Проверьте приглашение в предпросмотре — там работают конверт, анимации и музыка.</p><div style="display:grid;gap:8px"><button class="btn p" data-a="sv">${ic('check')} Сохранить проект</button><button class="btn" data-a="pv">${ic('eye')} Предпросмотр</button><button class="btn" data-a="opn">${ic('eye')} Открыть в браузере</button><button class="btn" data-a="dlh">${ic('download')} Скачать / отправить файл</button></div></div><div class="box" style="margin-top:14px"><h3>Ссылка для гостей</h3>${fld('Вставьте ссылку после публикации','<input type="url" data-p="url" placeholder="https://..." value="'+esc(cur.url)+'">')}<button class="btn g" style="width:100%" data-a="sh">${ic('share')} Поделиться</button><p class="hint" style="margin-top:8px">Есть ссылка — отправится она (WhatsApp и др.). Нет — отправится файл приглашения.</p><button class="btn s" style="margin-top:10px" data-a="hp">Как опубликовать бесплатно</button></div>`};
function panel(){$('#tb').innerHTML=TABS.map(([k,t,i])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';panel()">${ic(i)}<span>${t}</span></button>`).join('');$('#pn').innerHTML=PN[tab]();fit()}
function ed(){$('#app').innerHTML=`<div class="top"><button class="btn ic" aria-label="Назад" onclick="leave()">${ic('back')}</button><input class="nm" aria-label="Название проекта" value="${esc(cur.name)}" oninput="chg(()=>cur.name=this.value)"><button class="btn ic" id="un" aria-label="Отменить" onclick="undo()">${ic('undo')}</button><button class="btn ic" id="rd" aria-label="Повторить" onclick="redo()">${ic('redo')}</button><button class="btn p ic" aria-label="Предпросмотр" onclick="go('pre')">${ic('eye')}</button></div><div class="ec"><div class="pv"><iframe id="pf" title="Предпросмотр"></iframe></div><div class="pw"><nav class="tb" id="tb"></nav><div id="pn"></div></div></div>`;
const pn=$('#pn');
pn.oninput=e=>{const t=e.target,k=t.dataset;if(k.d)chg(()=>cur.d[k.d]=t.value);else if(k.s)chg(()=>cur.s[k.s]=t.type=='range'?+t.value:t.type=='checkbox'?t.checked:t.value);else if(k.p&&!k.v)chg(()=>cur[k.p]=t.value)};
pn.onchange=async e=>{const t=e.target;if('ev' in t.dataset){chg(()=>{cur.evt=t.value;applyEv()});panel();toast('Тексты обновлены под мероприятие (можно отменить ↶)');return}if(t.id=='fu'&&t.files.length){toast('Обработка фото…');const u=(await Promise.all([...t.files].map(rz))).filter(Boolean);chg(()=>cur.photos.push(...u));toast('Добавлено фото: '+u.length);panel()}
else if(t.id=='fr'&&t.files[0]){const u=await rz(t.files[0]);u&&chg(()=>cur.photos[ri]=u);panel()}
else if(t.id=='fm'&&t.files[0]){const f=t.files[0];if(f.size>12e6)return toast('Файл больше 12 МБ — выберите короче');const u=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});chg(()=>{cur.music=u;cur.mname=f.name});panel()}
else if(t.dataset.s&&(t.type=='color'||t.tagName=='SELECT'||t.type=='range'))t.tagName=='SELECT'&&0};
pn.onclick=e=>{const b=e.target.closest('[data-a],[data-v]');if(!b)return;const d=b.dataset;if(d.v){chg(()=>cur[d.p]=d.v);panel();return}
const[k,i0]=d.a.split(':'),i=+i0,ph=cur.photos;
if(k=='c'){chg(()=>cur.cover=i);panel()}else if(k=='l')mv(i,i-1);else if(k=='r')mv(i,i+1);
else if(k=='p'){ri=i;$('#fr').click()}
else if(k=='x'){chg(()=>{ph.splice(i,1);if(cur.cover>i)cur.cover--;if(cur.cover>=ph.length)cur.cover=0});panel()}
else if(k=='a'){chg(()=>{const p=PAL[i];Object.assign(cur.s,{bg:p[1],fg:p[2],ac:p[3]})});panel()}
else if(k=='dm'){chg(()=>{cur.music='';cur.mname=''});panel()}
else if(k=='dtxt'){chg(applyEv);panel()}
else if(k=='sv'){put(cur).then(()=>toast('Проект сохранён ✓'))}else if(k=='pv')go('pre');else if(k=='dlh')dlh();else if(k=='opn')opn();else if(k=='sh')sh();else if(k=='hp')go('help')};
panel();prev(1);ub()}
const mv=(i,j)=>{const ph=cur.photos;if(j<0||j>=ph.length)return;chg(()=>{[ph[i],ph[j]]=[ph[j],ph[i]];if(cur.cover==i)cur.cover=j;else if(cur.cover==j)cur.cover=i});panel()};
const rz=f=>new Promise(ok=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=()=>{toast('Не удалось открыть файл');ok(null)};i.src=u});
function chg(f){if(!ht){H.push(snap(cur));if(H.length>60)H.shift();RD=[]}clearTimeout(ht);ht=setTimeout(()=>ht=0,800);f();cur.upd=Date.now();clearTimeout(st);st=setTimeout(()=>put(cur),500);prev();ub()}
function after(){clearTimeout(ht);ht=0;panel();prev(1);put(cur);ub();const n=$('.nm');n&&(n.value=cur.name)}
function undo(){if(!H.length)return;RD.push(snap(cur));Object.assign(cur,H.pop());after()}
function redo(){if(!RD.length)return;H.push(snap(cur));Object.assign(cur,RD.pop());after()}
function ub(){const a=$('#un'),b=$('#rd');a&&(a.disabled=!H.length);b&&(b.disabled=!RD.length)}
function prev(now){clearTimeout(pt);pt=setTimeout(()=>{const f=$('#pf');if(!f)return;let y=0;try{y=f.contentWindow.scrollY}catch(e){}f.onload=()=>{try{f.contentWindow.scrollTo(0,y)}catch(e){}};f.srcdoc=doc(cur,true)},now?0:300)}
function leave(){put(cur);view='prj';draw()}
function pre(){$('#app').innerHTML=`<div class="top"><button class="btn ic" aria-label="Назад" onclick="go('ed')">${ic('back')}</button><div class="seg" style="flex:1;max-width:320px;margin:auto">${[['m','Телефон'],['d','Компьютер']].map(([k,t])=>`<button class="${dev==k?'on':''}" onclick="dev='${k}';pre()">${t}</button>`).join('')}</div></div><div class="pst"><div class="${dev=='m'?'phn':'pcw'}"><iframe id="fp" title="Предпросмотр"></iframe></div></div>`;$('#fp').srcdoc=doc(cur,false)}
const fl=()=>new File([doc(cur,false)],slug(cur.name)+'.html',{type:'text/html'});
function opn(){const w=open('','_blank');if(!w){toast('Браузер не дал открыть вкладку — скачиваю файл');return dlh()}w.document.write(doc(cur,false));w.document.close()}
async function dlh(){const f=fl();try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:f.name,data:f});return toast('Файл «'+f.name+'» готов')}}catch(e){if(e&&e.code=='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('Файл «'+f.name+'» сохранён')}
async function sh(){if(cur.url){const t=cur.d.n1+' & '+cur.d.n2+': '+LG[cur.lang].share+'\n'+cur.url;if(navigator.share)return navigator.share({text:t}).catch(()=>{});return open('https://wa.me/?text='+encodeURIComponent(t))}
const f=fl();if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:cur.name}).catch(()=>{});dlh();toast('Файл скачан. Опубликуйте его — см. «Помощь»')}
(async()=>{draw();P=(await tx('readonly',s=>s.getAll()))||[];if(view=='home'||view=='prj')draw()})();
</script></body></html>
